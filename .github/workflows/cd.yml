name: CD

# Runs only after CI succeeds on main (or manually).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    name: Build & push images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          build-args: APP_VERSION=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE }}-migrator:${{ env.SHA }}
            ${{ env.IMAGE }}-migrator:latest
          cache-from: type=gha

  migrate:
    name: Migrate production database
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::DATABASE_URL secret not set; skipping migrations"; exit 0; fi
          docker run --rm -e DATABASE_URL "$IMAGE-migrator:$SHA"

  deploy:
    name: Deploy & smoke test
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then echo "::warning::DEPLOY_HOOK_URL not set; image published but not deployed"; exit 0; fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL?imgURL=$IMAGE:$SHA" > /dev/null
          echo "Deploy triggered for $IMAGE:$SHA"
      - name: Wait for new version to be healthy
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::warning::APP_URL variable not set; skipping smoke test"; exit 0; fi
          for i in $(seq 1 40); do
            body=$(curl -fsS "$APP_URL/api/health" || true)
            echo "$body" | grep -q "\"version\":\"$SHA\"" && echo "Healthy: $body" && exit 0
            sleep 15
          done
          echo "::error::$APP_URL did not report version $SHA within 10 minutes"; exit 1
      - name: Summary
        run: |
          echo "### Deployed \`${SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
