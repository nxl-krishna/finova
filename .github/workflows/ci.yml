name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/unit.xml
      - name: Prisma schema is valid and migrations match it
        run: |
          node node_modules/prisma/build/index.js validate
          node node_modules/prisma/build/index.js migrate diff \
            --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DB" --exit-code
        env:
          SHADOW_DB: postgresql://finova:finova@localhost:5432/shadow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/unit.xml
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finova
          POSTGRES_PASSWORD: finova
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finova" --health-interval 5s --health-timeout 3s --health-retries 10

  e2e:
    name: End-to-end (Playwright + Postgres)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finova
          POSTGRES_PASSWORD: finova
          POSTGRES_DB: finova
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finova" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://finova:finova@localhost:5432/finova
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: Build
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker build & scan
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: finova:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name finova -p 3000:3000 \
            -e DATABASE_URL=postgresql://nobody:nobody@127.0.0.1:1/none -e AUTH_SECRET=smoke finova:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            [ "$code" = "200" ] && echo "Container serving (login 200)" && exit 0
            sleep 2
          done
          docker logs finova; exit 1
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: finova:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
