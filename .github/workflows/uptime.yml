name: Uptime check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.APP_URL != ''
    steps:
      - name: Check /api/health
        id: check
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 "${{ vars.APP_URL }}/api/health" || echo 000)
            [ "$code" = "200" ] && cat body.json && exit 0
            sleep 20
          done
          echo "status=$code" >> "$GITHUB_OUTPUT"; exit 1
      - name: Open an incident issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Production health check failing";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "incident" });
            if (open.data.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo, title, labels: ["incident"],
              body: `\`${{ vars.APP_URL }}/api/health\` returned **${{ steps.check.outputs.status }}** at ${new Date().toISOString()}.\n\n[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            });
